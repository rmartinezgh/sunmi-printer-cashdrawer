upstream odoo_backend {
    server odoo:8069;
}

upstream odoo_websocket {
    server odoo:8072;
}

limit_req_zone $binary_remote_addr zone=powerpos_api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name pos.powerpos.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pos.powerpos.local;

    ssl_certificate     /etc/ssl/certs/powerpos.crt;
    ssl_certificate_key /etc/ssl/private/powerpos.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /api/v1/ {
        limit_req zone=powerpos_api_limit burst=60 nodelay;
        proxy_pass http://odoo_backend;
    }

    location / {
        proxy_redirect off;
        proxy_pass http://odoo_backend;
    }
}

